name: Deploy CnE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cne-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-southeast-1
      S3_BUCKET: cne-frontend-103714492722-ap-southeast-1-an
      CLOUDFRONT_ID: EU69SYHSXAKFS
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Download source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check build configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || {
            echo "::error::Missing VITE_SUPABASE_URL"
            exit 1
          }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::103714492722:role/cne-github-deploy
          aws-region: ap-southeast-1
          allowed-account-ids: '103714492722'

      - name: Upload versioned assets
        run: |
          aws s3 sync dist/assets/ "s3://$S3_BUCKET/assets/" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      - name: Upload other website files
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "no-cache" \
            --only-show-errors

      - name: Publish homepage
        run: |
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html" \
            --only-show-errors

      - name: Refresh CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_ID" \
            --id "$INVALIDATION_ID"
